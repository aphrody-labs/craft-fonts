[package]
workspace = "../../../.."
name = "craft-fonts"
description = "The Crafting Apps' shared font assets: the manifest, finding a craft-fonts checkout, and loading or embedding the fonts."
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/storytold/craft-fonts"
rust-version = "1.90"
publish = false

[features]
# Compile every font in fonts/manifest.txt into the binary (about 43.8 MiB).
embed = []
# Compile every font in fonts/latin-manifest.txt into the binary (about 19.5 MiB).
embed-latin = []

[lints.rust]
unsafe_code = "forbid"
